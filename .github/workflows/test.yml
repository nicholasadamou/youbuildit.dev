name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: flox/install-flox-action@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Run shared checks
        run: flox activate -- bun run check
      - name: Install browser
        run: flox activate -- bunx playwright install --with-deps chromium
      - name: Browser journeys and accessibility
        run: flox activate -- bun run verify:browser
      - name: Save coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
