name: Trigger Rebuild
on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
permissions: {}
concurrency:
  group: content-rebuild
  cancel-in-progress: false
jobs:
  trigger-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request a Vercel build
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::Configure VERCEL_DEPLOY_HOOK with the project deploy-hook URL.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --request POST "$DEPLOY_HOOK"
