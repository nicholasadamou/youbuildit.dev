name: auto-release
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: auto-release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Release the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          head="$(git rev-parse HEAD)"
          existing="$(git tag --points-at "$head" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$existing" ]; then
            tag="$existing"
          else
            latest="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$latest" ]; then
              tag=v0.1.0
            else
              version="${latest#v}"
              tag="v${version%.*}.$((${version##*.} + 1))"
            fi
            git tag "$tag" "$head"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          fi
