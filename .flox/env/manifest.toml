schema-version = "1.18.0"

[install]
nodejs.pkg-path = "nodejs_24"
bun.pkg-path = "bun"
bun.version = "1.3.11"
git.pkg-path = "git"
postgresql.pkg-path = "postgresql_17"

[vars]
NEXT_TELEMETRY_DISABLED = "1"

[hook]
on-activate = '''
  cd "$FLOX_ENV_PROJECT"
  if [ -d .git ]; then git config core.hooksPath .husky/_; fi
'''

[services.web]
command = "bun run dev --hostname 127.0.0.1 --port 4317"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
